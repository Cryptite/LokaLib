# SSH deploy config for the `uploadJar` task. The upload runs `scp` inside WSL2,
# so it uses the OpenSSH keys / known_hosts / ssh config in your WSL home.
# deployHost is required; the rest have defaults applied by the task.
deployHost=us-dhanri
deployUser=cryptite
deployDir=/usr/local/lokacommon/server/global/plugins/update/
# Optional. Omit to use WSL's default identities / ssh config. If set, this is a
# path INSIDE WSL (e.g. /home/you/.ssh/id_ed25519), not a Windows path.
deployKey=~/.ssh/us-dhanri